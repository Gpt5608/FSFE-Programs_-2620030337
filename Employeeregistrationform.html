<html>
<head>
    <title>Employee Registration Form</title>
</head>
<body>
    <h1>Employee Registration Form</h1>
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone"><br><br>

        <label for="position">Position:</label>
        <select id="position" name="position">
            <option value="manager">Manager</option>
            <option value="developer">Developer</option>
            <option value="designer">Designer</option>
        </select><br><br>
        <input type="submit" value="Register">
        <input type="file" id="resume" name="resume" accept=".pdf">
        <label for="age">Age:</label>
        <input type="number" id="age" name="age"><br><br>
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob"><br><br>
        <input preffer="male" type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label><br>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br><br>
        <label for="address">Address:</label><br>
        <textarea id="address" name="address" rows="4" cols="50"></textarea><br><br>
        <label for="department">Department:</label>
        <input type="text" id="department" name="department"><br><br>
        <label for="salary">Salary:</label>
        <input type="number" id="salary" name="salary"><br><br>
        <input type="skills" name="skills" value="Java"> 
        <input type="skills" name="skills" value="Python"> 
        <input type="skills" name="skills" value="C++"> <br><br>
        <label for="experience">Experience (in years):</label>
        <input type="number" id="experience" name="experience"><br><br>
        <label for="emergency_contact">Emergency Contact:</label>
        <input type="tel" id="emergency_contact" name="emergency_contact"><br><br>
        </select><br><br>
        <input type="checkbox" id="linkedin_profile" name="linkedin_profile" value="LinkedIn Profile">
        <label for="linkedin_profile">LinkedIn Profile</label><br>
        <input type="checkbox" id="github_profile" name="github_profile" value="GitHub Profile">
        <label for="github_profile">GitHub Profile</label><br>
        <input type="checkbox" id="work_experience" name="work_experience" value="Work Experience">
        <label for="work_experience">Work Experience</label><br>
        <input type="checkbox" id="portfolio" name="portfolio" value="Portfolio">
        <label for="portfolio">Portfolio</label><br>
    </form>
</body>
</html>
