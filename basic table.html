<!DOCTYPE html>
<html>
<head>
    <title>Basic HTML Table</title>
</head>
<body>
    <h2>Employee Information Table</h2>
    <table border="10" align="center" bordercolor="red">
        <tr> <!-- Table Row -->
            <th>Name</th> <!-- Table Header -->
            <th>Age</th>
            <th>Department</th>
        </tr>
        <tr>
        <td>John Doe</td> <!-- Table Data -->
        <td>30</td>
            <td>HR</td>
        </tr>
        <tr>
            <td>Jane Smith</td>
            <td>25</td>
            <td>Finance</td>
        </tr>
        <tr>
            <td>Emily Johnson</td>
            <td>28</td>
            <td>IT</td>
        </tr>
    </table>

</body>
</html>
